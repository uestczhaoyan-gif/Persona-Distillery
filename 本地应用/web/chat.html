<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-token" content="__LOCAL_TOKEN__"><title>人物视角 · 直接对话</title><link rel="stylesheet" href="/style.css"><script src="/chat.js" defer></script></head><body><header><div><span class="eyebrow">PERSONA DISTILLERY</span><h1>从你真正关心的问题开始。</h1><p>直接对话 <span class="badge">仅本机运行</span></p></div><p class="notice">AI 人物视角模拟<br>不是本人或历史原话</p></header><nav class="mode-nav" aria-label="工作形式"><a href="/home">工作空间</a><a href="/chat" aria-current="page">直接对话</a><a href="/">圆桌讨论</a><a href="/lecture">定题演讲</a><a href="/story">故事推演</a></nav>
<main><aside><section class="card"><h2>选一个交谈视角</h2><form id="create-form"><label for="person">人物</label><select id="person" required></select><label for="model">已安装的 Ollama 模型名</label><input id="model" required autocomplete="off"><label class="check"><input id="preview" type="checkbox">同意预览历史公共人物草稿</label><label class="check"><input id="local-confirm" type="checkbox" required>确认使用本机 Ollama 服务</label><button class="primary" type="submit">开始新对话</button></form><p class="hint">对话只保存在当前服务的内存中。刷新可恢复；关闭对话或重启服务后清除。不自动保存完整聊天记录。</p></section><section class="card"><h2>按需深入</h2><p class="hint">先自然交谈，需要时再查看依据。事后检索材料不等于模型实际引用过它们。</p><button id="audit" disabled>查看最近回答的依据</button><button id="close" disabled>关闭当前对话</button></section></aside>
<div class="workspace"><section class="card"><div class="section-head"><h2 id="title">你想聊些什么？</h2><span class="badge" id="status">尚未开始</span></div><div id="alert" role="status" aria-live="polite"></div><div id="turns" class="turns"><p class="hint">选择人物和本机模型，再说出你的问题。</p></div><form id="send-form"><label for="question">你的问题</label><textarea id="question" rows="3" maxlength="10000" required placeholder="描述具体处境，或接着上一句话追问。"></textarea><button class="primary" id="send" disabled>发送</button></form></section><section class="card"><h2>依据与限制</h2><div id="audit-view"><p class="hint">需要时点击“查看最近回答的依据”，这里才展开材料。</p></div></section></div></main><footer>当前只接历史公共人物；真实对话质量仍待评审。</footer></body></html>
